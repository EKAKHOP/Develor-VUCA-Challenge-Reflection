<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ჩემი მოგზაურობის ჟურნალი</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#7f5290;
    --purple-dark:#4e3161;
    --green:#8dc63f;
    --orange:#f26522;
    --grey-light:#efefef;
    --grey:#cccccc;
    --ink:#2a2a2a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:"Century Gothic","Questrial","Noto Sans Georgian",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#ffffff;
    color:var(--ink);
    -webkit-text-size-adjust:100%;
  }
  .mtavruli{font-family:"Noto Sans Georgian",sans-serif;letter-spacing:.3px;}
  #app-root{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    max-width:480px;
    margin:0 auto;
    background:#fff;
    overflow:hidden;
  }
  .topbar{
    flex:0 0 auto;
    padding:10px 16px 8px;
    background:var(--purple);
  }
  .topbar.empty{padding:0;}
  .progress-track{
    height:8px;
    background:rgba(255,255,255,.3);
    border-radius:4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:var(--orange);
    border-radius:4px;
    transition:width .2s ease;
  }
  .progress-label{
    margin-top:6px;
    font-size:13px;
    color:#fff;
    display:flex;
    justify-content:space-between;
  }
  .timer-display{font-size:12px;color:rgba(255,255,255,.85);}
  .timer-display.expired{color:#ffe1b0;font-weight:bold;}
  main#content{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:12px 18px 24px;
  }
  .bottombar{
    flex:0 0 auto;
    display:flex;
    gap:10px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--grey-light);
    background:#fff;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    -webkit-tap-highlight-color:transparent;
  }
  .btn{
    min-height:48px;
    border-radius:12px;
    font-size:15px;
    font-weight:bold;
    padding:12px 16px;
  }
  .btn-primary{
    background:var(--purple);
    color:#fff;
    flex:2;
  }
  .btn-primary:disabled{
    background:var(--grey);
    color:#888;
    cursor:not-allowed;
  }
  .btn-secondary{
    background:var(--grey-light);
    color:var(--ink);
    flex:1;
  }
  .btn-full{flex:1 1 100%;}
  h1.screen-title{
    font-size:20px;
    line-height:1.3;
    margin:4px 0 4px;
    color:var(--purple);
  }
  p.hint{
    font-size:14px;
    color:#666;
    margin:0 0 14px;
  }
  .chip-list{display:flex;flex-direction:column;gap:10px;}
  .chip{
    display:block;
    width:100%;
    text-align:left;
    background:var(--grey-light);
    border:2px solid var(--grey-light);
    border-radius:12px;
    padding:13px 16px;
    font-size:16px;
    min-height:48px;
    color:var(--ink);
  }
  .chip.selected{
    background:#f3ecf7;
    border-color:var(--purple);
    color:var(--purple);
    font-weight:bold;
  }
  textarea, input[type=text]{
    width:100%;
    font-family:inherit;
    font-size:16px;
    padding:12px 14px;
    border:2px solid var(--grey);
    border-radius:12px;
    resize:none;
    overflow:hidden;
    min-height:48px;
    color:var(--ink);
  }
  textarea:focus,input[type=text]:focus{outline:none;border-color:var(--purple);}
  label.field-label{
    display:block;
    font-size:14px;
    font-weight:bold;
    color:#555;
    margin:14px 0 6px;
  }
  .q-block{margin-bottom:20px;}
  .q-block .field-label{margin-top:0;}
  .scale-row{display:flex;gap:8px;margin:10px 0 6px;}
  .scale-btn{
    flex:1;
    min-height:52px;
    border-radius:12px;
    background:var(--grey-light);
    font-size:18px;
    font-weight:bold;
    color:var(--ink);
    border:2px solid var(--grey-light);
  }
  .scale-btn.selected{
    background:var(--purple);
    border-color:var(--purple);
    color:#fff;
  }
  .scale-endlabels{display:flex;justify-content:space-between;font-size:12px;color:#777;margin-bottom:4px;}
  .competency-block{margin-bottom:24px;padding-bottom:4px;border-bottom:2px solid var(--grey-light);}
  .competency-head{font-size:16px;font-weight:bold;margin-bottom:2px;}
  .competency-sub{font-size:13px;color:#777;margin-bottom:6px;}
  .competency-desc{font-size:14px;color:#555;margin-bottom:10px;line-height:1.4;}
  .statement-text{font-size:15px;margin:10px 0 2px;line-height:1.4;}
  .card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    text-align:left;
    background:var(--grey-light);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
    min-height:64px;
  }
  .card-title{font-size:17px;font-weight:bold;color:var(--ink);}
  .card-sub{font-size:13px;color:#777;margin-top:2px;}
  .status-pill{
    font-size:12px;
    font-weight:bold;
    padding:5px 10px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .status-not{background:var(--grey);color:#444;}
  .status-progress{background:var(--orange);color:#fff;}
  .status-done{background:var(--green);color:#fff;}
  .home-intro{
    background:#f3ecf7;
    border-radius:var(--radius);
    padding:14px 16px;
    font-size:14px;
    color:var(--purple-dark);
    margin-bottom:18px;
    line-height:1.5;
  }
  .quad-bars{display:flex;flex-direction:column;gap:14px;margin:12px 0;}
  .quad-bar-row .quad-label{font-size:14px;font-weight:bold;margin-bottom:5px;}
  .quad-bar-track{background:var(--grey-light);border-radius:8px;height:26px;overflow:hidden;}
  .quad-bar-fill{height:100%;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:8px;color:#fff;font-size:12px;font-weight:bold;transition:width .2s;}
  .strength-box{background:#eef7e0;border:2px solid var(--green);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;}
  .growth-box{background:#fff6ec;border:2px solid var(--orange);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px;}
  .diagram-placeholder{
    border:2px dashed var(--grey);border-radius:var(--radius);padding:22px 16px;
    text-align:center;color:#888;font-size:13px;margin-bottom:16px;background:var(--grey-light);line-height:1.5;
  }
  .competency-table{border:2px solid var(--grey-light);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;}
  .competency-table .ct-row{display:flex;gap:14px;padding:14px 16px;border-bottom:1px solid var(--grey-light);align-items:flex-start;}
  .competency-table .ct-row:last-child{border-bottom:none;}
  .competency-table .ct-label{flex:0 0 108px;}
  .competency-table .ct-label .en{display:block;font-size:13px;font-weight:bold;letter-spacing:.5px;}
  .competency-table .ct-label .ka{display:block;font-size:12px;opacity:.85;margin-top:1px;}
  .competency-table .ct-title{font-size:14px;font-weight:bold;color:var(--ink);margin-bottom:3px;}
  .competency-table .ct-desc{font-size:13px;color:#555;line-height:1.4;}
  .tool-detail h2{color:var(--purple);font-size:20px;margin:4px 0 14px;}
  .tool-section-label{font-size:13px;font-weight:bold;color:var(--purple);margin:16px 0 6px;letter-spacing:.3px;}
  .tool-body-text{font-size:15px;line-height:1.6;color:var(--ink);}
  .tool-steps{margin:0;padding-left:20px;font-size:15px;line-height:1.6;}
  .tool-steps li{margin-bottom:6px;}
  details.theory-details{margin:4px 0 4px;background:var(--grey-light);border-radius:10px;padding:10px 12px;}
  details.theory-details summary{font-weight:bold;color:var(--purple);cursor:pointer;font-size:14px;}
  details.theory-details[open] summary{margin-bottom:8px;}
  .example-box{background:#f3ecf7;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;color:var(--purple-dark);margin:6px 0;}
  .mistake-box{background:#fff6ec;border:1px solid var(--orange);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;color:#8a4a16;margin:6px 0;}
  .emo-group{margin-bottom:12px;}
  .emo-group-label{font-size:13px;font-weight:bold;color:#555;margin-bottom:6px;}
  .emo-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px;}
  .emo-chip{padding:7px 12px;border-radius:20px;background:var(--grey-light);border:2px solid var(--grey-light);font-size:13px;color:var(--ink);}
  .emo-chip.selected{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:bold;}
  .summary-section{margin-bottom:18px;}
  .summary-section h3{font-size:14px;color:var(--purple);margin:0 0 6px;border-bottom:2px solid var(--grey-light);padding-bottom:4px;text-transform:uppercase;}
  .summary-text{font-size:15px;line-height:1.5;color:var(--ink);white-space:pre-wrap;}
  .summary-empty{font-size:14px;color:#999;font-style:italic;}
  .qa-item{margin-bottom:10px;}
  .qa-q{font-size:13px;color:#777;margin-bottom:2px;}
  .qa-a{font-size:15px;color:var(--ink);white-space:pre-wrap;}
  .quad-tag{
    display:inline-block;color:#fff;font-size:12px;font-weight:bold;
    padding:3px 9px;border-radius:10px;margin:0 4px 6px 0;text-transform:uppercase;
  }
  .note-box{
    background:#fff6ec;border:1px solid var(--orange);color:#8a4a16;
    border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;
  }
  .closing-note{background:#f3ecf7;border-radius:10px;padding:14px 16px;font-size:14px;color:var(--purple-dark);line-height:1.5;margin-top:10px;}
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:24px;
  }
  .modal-box{background:#fff;border-radius:var(--radius);padding:22px 20px;max-width:360px;width:100%;}
  .modal-box p{font-size:16px;line-height:1.5;margin:0 0 18px;}
  .modal-actions{display:flex;gap:10px;}
  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;
    font-size:14px;z-index:60;max-width:85%;text-align:center;
  }
  .final-btn-stack{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .btn-outline{background:#fff;border:2px solid var(--purple);color:var(--purple);}
  .btn-danger-outline{background:#fff;border:2px solid var(--orange);color:var(--orange);}
  .pdf-intro{font-size:15px;line-height:1.6;color:var(--ink);margin-bottom:18px;}
  .pdf-list{font-size:14px;line-height:1.7;color:#555;margin-bottom:18px;padding-left:18px;}
  .pdf-hidden-container{position:absolute;left:-99999px;top:0;}
  .pdf-page{width:794px;min-height:1123px;background:#fff;padding:50px 55px;font-family:"Century Gothic","Noto Sans Georgian",sans-serif;color:#222;}
  .pdf-page h1{color:var(--purple);font-size:24px;margin:0 0 4px;}
  .pdf-page .pdf-sub{font-size:13px;color:#777;margin-bottom:20px;}
  .pdf-page h3{font-size:14px;color:var(--purple);border-bottom:1px solid #ddd;padding-bottom:3px;margin:16px 0 6px;}
  .pdf-page .pdf-text{font-size:13px;line-height:1.5;}
  .pdf-section{margin-bottom:22px;}
  .pdf-icon-circle{width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;}
  .pdf-icon-circle.green{background:var(--green);}
  .pdf-icon-circle svg{display:block;}
  .pdf-quad-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .pdf-quad-cell{display:flex;align-items:center;gap:8px;width:46%;background:#f7f5f9;border-radius:8px;padding:8px 10px;}
  .pdf-quad-cell .pdf-icon-circle{width:26px;height:26px;}
  .pdf-quad-cell .label{font-size:12px;font-weight:bold;}
  .pdf-quad-cell .score{font-size:11px;color:#777;}
  .pdf-callout-row{display:flex;gap:10px;margin-top:10px;}
  .pdf-callout{flex:1;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.45;}
  .pdf-callout.strong{background:#eef6e1;border:1px solid var(--green);}
  .pdf-callout.growth{background:#f6f1f9;border:1px solid var(--purple);}
  .pdf-callout .cap{font-size:10px;font-weight:bold;text-transform:uppercase;color:#777;margin-bottom:3px;}
  .pdf-part-head{display:flex;align-items:center;gap:8px;margin:18px 0 8px;}
  .pdf-part-badge{width:22px;height:22px;border-radius:50%;background:var(--purple);color:#fff;font-size:11px;font-weight:bold;display:flex;align-items:center;justify-content:center;flex:none;}
  .pdf-part-title{font-size:13px;font-weight:bold;color:var(--purple);}
  .pdf-qa{font-size:12px;line-height:1.5;margin-bottom:7px;background:#faf9fb;border-radius:6px;padding:6px 9px;}
  .pdf-qa .q{color:#888;font-size:10.5px;font-weight:bold;text-transform:uppercase;margin-bottom:2px;}
  .pdf-step-callout{display:flex;gap:10px;align-items:flex-start;background:#f6f1f9;border-radius:8px;padding:10px 12px;margin-top:8px;}
  .pdf-step-callout .pdf-icon-circle{margin-top:1px;}
  .pdf-tool-card{background:#faf9fb;border-radius:9px;padding:12px 14px;margin-bottom:12px;}
  .pdf-tool-head{display:flex;align-items:center;gap:9px;margin-bottom:6px;}
  .pdf-tool-title{font-size:14px;font-weight:bold;color:var(--purple);}
  .pdf-tool-sub{font-size:10.5px;font-weight:bold;color:#888;margin:7px 0 2px;text-transform:uppercase;}
  .pdf-tool-text{font-size:12px;line-height:1.45;margin-bottom:2px;}
  .pdf-example-box{background:#eef6e1;border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.45;font-style:italic;}
  .pdf-mistake-box{background:#fdf1ea;border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.45;}
</style>
</head>
<body>
<div id="app-root">
  <div class="topbar" id="topbar"></div>
  <main id="content"></main>
  <div class="bottombar" id="bottombar"></div>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<div class="pdf-hidden-container" aria-hidden="true">
  <div class="pdf-page" id="pdfPage1"></div>
  <div class="pdf-page" id="pdfPage2"></div>
</div>

var STATEMENTS = [
  {n:1, key:"vision", text:"აქტიურად ვმონაწილეობდი მომავლის მკაფიო სურათის შექმნაში."},

function defaultState(){
  return {
    selfScores:[0,0,0,0,0,0,0,0],
    p1:{q1:"",q2:"",q3:"",q4:""},
    p2:{role:"",roleNote:"",q2:"",q3:"",q4:"",q5:""},
    p3:{emoStart:"",emoMid:"",emoEnd:"",emoNote:"",q2:"",q3:"",q4:""},
    p4:{q1:"",q2:"",q3:"",q4:"",q5:""},
    p5:{q1:"",reaction:"",reactionNote:"",compHelp:"",compHelpNote:"",compLack:"",compLackNote:"",insight:""},
    p6:{keep:"",change:"",situation:"",tool:"",toolNote:"",hinderHelp:""},
    flags:{reflectDone:false}
  };
}

var state = loadState();
var nav = {screen:"home"};
var timerHandle = null;

function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    var d = defaultState();
    ["p1","p2","p3","p4","p5","p6"].forEach(function(k){
      if(parsed[k]) d[k] = Object.assign(d[k], parsed[k]);
    });
    if(Array.isArray(parsed.selfScores) && parsed.selfScores.length===8) d.selfScores = parsed.selfScores;
    d.flags = Object.assign(d.flags, parsed.flags||{});
    return d;
  }catch(e){ return defaultState(); }
}

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function escapeHtml(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Georgian mkhedruli->mtavruli conversion. CSS text-transform:uppercase is unreliable
// for Georgian on many browsers, so we pre-convert text in JS (String.toUpperCase
// correctly maps Georgian mkhedruli to mtavruli per Unicode default case folding).
function U(s){
  return String(s==null?"":s).toUpperCase();
}

function trimEndPunct(s){
  return String(s==null?"":s).replace(/[.!?]+\s*$/,"");
}

function qs(sel, root){ return (root||document).querySelector(sel); }
function qsa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }

function clearTimer(){
  if(timerHandle){ clearInterval(timerHandle); timerHandle = null; }
}

function go(screen, extra){
  clearTimer();
  nav = Object.assign({screen:screen}, extra||{});
  render();
  qs("#content").scrollTop = 0;
}

/* ---------- scoring helpers ---------- */
function competencyAvg(key){
  var idxs = STATEMENTS.filter(function(s){return s.key===key;}).map(function(s){return s.n-1;});
  var vals = idxs.map(function(i){return state.selfScores[i];}).filter(function(v){return v>0;});
  if(!vals.length) return 0;
  return vals.reduce(function(a,b){return a+b;},0) / vals.length;
}
function allCompetencyAvgs(){
  var out = {};
  QUAD_ORDER.forEach(function(k){ out[k] = competencyAvg(k); });
  return out;
}
function strongAndGrowth(){
  var avgs = allCompetencyAvgs();
  var answered = QUAD_ORDER.filter(function(k){return avgs[k]>0;});
  if(!answered.length) return {strong:[], growth:[]};
  var max = Math.max.apply(null, answered.map(function(k){return avgs[k];}));
  var min = Math.min.apply(null, answered.map(function(k){return avgs[k];}));
  return {
    strong: answered.filter(function(k){return avgs[k]===max;}),
    growth: answered.filter(function(k){return avgs[k]===min;})
  };
}

function hasDataReflect(){
  if(state.selfScores.some(function(v){return v>0;})) return true;
  var parts = [state.p1,state.p2,state.p3,state.p4,state.p5,state.p6];
  return parts.some(function(p){
    return Object.keys(p).some(function(k){ return p[k]; });
  });
}
function statusOf(){
  return state.flags.reflectDone ? "done" : (hasDataReflect() ? "progress" : "not");
}
function statusLabel(s){
  if(s==="done") return "დასრულებულია";
  if(s==="progress") return "დაწყებულია";
  return "არ დაწყებულა";
}
function statusClass(s){
  if(s==="done") return "status-done";
  if(s==="progress") return "status-progress";
  return "status-not";
}

/* ---------- render dispatcher ---------- */
function render(){
  renderTopbar();
  renderContent();
  renderBottombar();
}

function renderTopbar(){
  var tb = qs("#topbar");
  if(nav.screen==="reflect" && nav.step<=REFLECT_LAST_PART){
    var pct = Math.round((nav.step/REFLECT_LAST_PART)*100);
    var label = nav.step===0 ? "თვითშეფასება" : ("ნაწილი "+nav.step+"/"+REFLECT_LAST_PART);
    tb.className = "topbar";
    tb.innerHTML =
      '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
      '<div class="progress-label"><span>'+label+'</span><span id="timerDisplay" class="timer-display"></span></div>';
    startPartTimer(nav.step===0 ? 180 : 120);
  } else {
    tb.className = "topbar empty";
    tb.innerHTML = "";
  }
}

function startPartTimer(totalSeconds){
  if(!nav.timerDeadline) nav.timerDeadline = Date.now() + totalSeconds*1000;
  var disp = qs("#timerDisplay");
  function tick(){
    disp = qs("#timerDisplay");
    if(!disp) return;
    var remain = Math.round((nav.timerDeadline - Date.now())/1000);
    if(remain <= 0){
      disp.textContent = "⏰ დრო ამოიწურა";
      disp.className = "timer-display expired";
    } else {
      var m = Math.floor(remain/60), s = remain%60;
      disp.textContent = m+":"+(s<10?"0":"")+s;
      disp.className = "timer-display";
    }
  }
  tick();
  clearTimer();
  timerHandle = setInterval(tick, 1000);
}

function renderContent(){
  var el = qs("#content");
  var html = "";
  switch(nav.screen){
    case "home": html = screenHome(); break;
    case "reflect":
      html = (nav.step<=REFLECT_LAST_PART) ? screenReflectPart(nav.step) : screenSummary();
      break;
    case "toolsList": html = screenToolsList(); break;
    case "toolCard": html = screenToolCard(nav.id); break;
    case "pdf": html = screenPdf(); break;
  }
  el.innerHTML = html;
  attachHandlers();
  qsa("textarea", el).forEach(autoGrow);
}

function renderBottombar(){
  var bb = qs("#bottombar");
  var html = "";
  if(nav.screen==="home"){
    bb.style.display = "none"; bb.innerHTML = ""; return;
  }
  bb.style.display = "flex";
  if(nav.screen==="toolsList" || nav.screen==="pdf"){
    html = '<button class="btn btn-secondary btn-full mtavruli" id="btnBack">← '+U("მთავარი")+'</button>';
  } else if(nav.screen==="toolCard"){
    html = '<button class="btn btn-secondary btn-full mtavruli" id="btnBack">← '+U("სახელმძღვანელოში დაბრუნება")+'</button>';
  } else if(nav.screen==="reflect"){
    if(nav.step <= REFLECT_LAST_PART){
      html = '<button class="btn btn-secondary mtavruli" id="btnBack">'+U("უკან")+'</button>'+
             '<button class="btn btn-primary mtavruli" id="btnNext">'+U("შემდეგი")+'</button>';
    } else {
      html = '<button class="btn btn-secondary mtavruli" id="btnBack">'+U("უკან")+'</button>'+
             '<button class="btn btn-primary mtavruli" id="btnNext">'+U("მთავარზე დაბრუნება")+'</button>';
    }
  }
  bb.innerHTML = html;
  var back = qs("#btnBack"); if(back) back.addEventListener("click", onBack);
  var next = qs("#btnNext"); if(next) next.addEventListener("click", onNext);
}

function onBack(){
  if(nav.screen==="toolCard"){ go("toolsList"); return; }
  if(nav.screen==="toolsList" || nav.screen==="pdf"){ go("home"); return; }
  if(nav.screen==="reflect"){
    if(nav.step<=0){ go("home"); return; }
    go("reflect", {step: nav.step - 1});
  }
}

function onNext(){
  if(nav.screen==="reflect"){
    if(nav.step >= REFLECT_LAST_PART+1){ go("home"); return; }
    var next = nav.step + 1;
    if(next === REFLECT_LAST_PART+1){ state.flags.reflectDone = true; save(); }
    go("reflect", {step: next});
    return;
  }
}

/* ---------- autosize ---------- */
function autoGrow(el){
  el.style.height = "auto";
  el.style.height = (el.scrollHeight) + "px";
}

/* ---------- field helpers ---------- */
function qBlock(fieldPath, label, value){
  return '<div class="q-block"><label class="field-label">'+label+'</label>'+
    '<textarea data-field="'+fieldPath+'" placeholder="დაწერეთ...">'+escapeHtml(value)+'</textarea></div>';
}
function chipGroup(fieldPath, options, selected, compact){
  var cls = compact ? "emo-chip-row" : "chip-list";
  var itemCls = compact ? "emo-chip" : "chip";
  var out = '<div class="'+cls+'">';
  options.forEach(function(o){
    var sel = selected===o;
    out += '<button class="'+itemCls+(sel?" selected":"")+'" data-choice="'+fieldPath+'::'+escapeHtml(o)+'">'+o+'</button>';
  });
  out += '</div>';
  return out;
}
function noteField(fieldPath, value){
  return '<textarea data-field="'+fieldPath+'" placeholder="დამატებით, თუ გსურთ..." style="margin-top:8px;">'+escapeHtml(value)+'</textarea>';
}

/* ---------- REFLECT PART DISPATCH ---------- */
function screenReflectPart(step){
  if(step===0) return screenSelfAssessment();
  if(step===1) return screenPart1();
  if(step===2) return screenPart2();
  if(step===3) return screenPart3();
  if(step===4) return screenPart4();
  if(step===5) return screenPart5();
  if(step===6) return screenPart6();
  return "";
}

/* ---------- PART 0: SELF-ASSESSMENT ---------- */

  QUAD_ORDER.forEach(function(key){
    var q = QUAD[key];

    out += '<div class="competency-head mtavruli" style="color:'+q.color+'">'+U(q.label)+' ('+U(q.sub)+')</div>';

      out += '<div class="statement-text">'+s.n+'. '+s.text+'</div>';

/* ---------- event handlers ---------- */
function getPath(obj, path){
  var parts = path.split(".");
  var o = obj;
  for(var i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  return {obj:o, key:parts[parts.length-1]};
}

function attachHandlers(){
  var root = qs("#content");

  qsa("[data-nav]", root).forEach(function(btn){
    btn.addEventListener("click", function(){
      var target = btn.getAttribute("data-nav");
      if(target==="reflect") go("reflect", {step:0});
      else if(target==="toolsList") go("toolsList");
      else if(target==="pdf") go("pdf");
    });
  });

  qsa("[data-field]", root).forEach(function(el){
    el.addEventListener("input", function(){
      var p = getPath(state, el.getAttribute("data-field"));
      p.obj[p.key] = el.value;
      save(); autoGrow(el);
    });
  });

  qsa("[data-choice]", root).forEach(function(btn){
    btn.addEventListener("click", function(){
      var raw = btn.getAttribute("data-choice");
      var sep = raw.indexOf("::");
      var fieldPath = raw.slice(0,sep);
      var value = raw.slice(sep+2);
      var p = getPath(state, fieldPath);
      p.obj[p.key] = (p.obj[p.key]===value) ? "" : value;
      save(); render();
    });
  });

  qsa("[data-selfscore]", root).forEach(function(btn){
    btn.addEventListener("click", function(){
      var n = parseInt(btn.getAttribute("data-selfscore"),10);
      var val = parseInt(btn.getAttribute("data-val"),10);
      state.selfScores[n-1] = (state.selfScores[n-1]===val) ? 0 : val;
      save(); render();
    });
  });

  qsa("[data-toolcard]", root).forEach(function(btn){
    btn.addEventListener("click", function(){
      go("toolCard", {id: parseInt(btn.getAttribute("data-toolcard"),10)});
    });
  });

  qsa("[data-tool-link]", root).forEach(function(btn){
    btn.addEventListener("click", function(){
      go("toolCard", {id: parseInt(btn.getAttribute("data-tool-link"),10)});
    });
  });

  var btnReset = qs("#btnReset", root);
  if(btnReset) btnReset.addEventListener("click", openResetModal);

  var btnPdf = qs("#btnPdf", root);
  var pdfFallback = qs("#pdfFallback", root);
  if(btnPdf){
    checkPdfAvailable().then(function(ok){
      if(ok){ btnPdf.style.display="block"; }
      else if(pdfFallback){ pdfFallback.style.display="block"; }
    });
    btnPdf.addEventListener("click", downloadPdf);
  }
}

/* ---------- PDF radar chart ---------- */
function radarChartHtml(avgs){
  var W=300, H=270, cx=150, cy=140, maxR=90;
  var angles = {vision:-90, understanding:0, clarity:90, agility:180};
  function pt(deg, r){
    var rad = deg*Math.PI/180;
    return {x: cx + r*Math.cos(rad), y: cy + r*Math.sin(rad)};
  }
  var svg = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  [0.33,0.66,1].forEach(function(f){
    var ptsStr = QUAD_ORDER.map(function(k){ var p=pt(angles[k], maxR*f); return p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" ");
    svg += '<polygon points="'+ptsStr+'" fill="none" stroke="#ddd" stroke-width="1"/>';
  });
  QUAD_ORDER.forEach(function(k){
    var p = pt(angles[k], maxR);
    svg += '<line x1="'+cx+'" y1="'+cy+'" x2="'+p.x.toFixed(1)+'" y2="'+p.y.toFixed(1)+'" stroke="#ddd" stroke-width="1"/>';
  });
  var scorePts = QUAD_ORDER.map(function(k){
    var v = avgs[k]||0;
    var p = pt(angles[k], (v/5)*maxR);
    return p.x.toFixed(1)+","+p.y.toFixed(1);
  }).join(" ");
  svg += '<polygon points="'+scorePts+'" fill="#7f529033" stroke="#7f5290" stroke-width="2"/>';
  QUAD_ORDER.forEach(function(k){
    var v = avgs[k]||0;
    var p = pt(angles[k], (v/5)*maxR);
    svg += '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.2" fill="'+QUAD[k].color+'"/>';
  });
  svg += '</svg>';

  var labelsHtml = '';
  QUAD_ORDER.forEach(function(k){
    var p = pt(angles[k], maxR+26);
    var v = avgs[k];
    labelsHtml += '<div style="position:absolute;left:'+p.x.toFixed(1)+'px;top:'+p.y.toFixed(1)+'px;transform:translate(-50%,-50%);font-size:11px;font-weight:bold;color:'+QUAD[k].color+';white-space:nowrap;text-align:center;">'+QUAD[k].label+(v?(' · '+v.toFixed(1)):'')+'</div>';
  });

  return '<div style="position:relative;width:'+W+'px;height:'+H+'px;margin:4px auto 0;">'+svg+labelsHtml+'</div>';
}

/* ---------- PDF ---------- */
function pdfLibsReady(){
  return !!(window.html2canvas && window.jspdf && window.jspdf.jsPDF);
}
function checkPdfAvailable(){
  return new Promise(function(resolve){
    var supportsDownload = "download" in document.createElement("a");
    if(!supportsDownload){ resolve(false); return; }
    if(pdfLibsReady()){ resolve(true); return; }
    if(window.__pdfLibFailed){ resolve(false); return; }
    var tries = 0;
    var iv = setInterval(function(){
      tries++;
      if(pdfLibsReady()){ clearInterval(iv); resolve(true); }
      else if(window.__pdfLibFailed || tries>20){ clearInterval(iv); resolve(false); }
    }, 250);
  });
}

    h2 += '<div class="pdf-tool-sub">რა არის</div><div class="pdf-tool-text">'+t.what+'</div>';
    h2 += '<div class="pdf-tool-sub">თეორიული საფუძველი</div><div class="pdf-tool-text">'+t.theory+'</div>';
    h2 += '<div class="pdf-tool-sub">როდის გამოვიყენო</div><div class="pdf-tool-text">'+t.when+'</div>';

    h2 += '<div class="pdf-tool-sub">ხშირი შეცდომა</div><div class="pdf-mistake-box">'+t.mistake+'</div>';
    h2 += '</div>';

var PDF_MARGIN_MM = 12;
var PDF_NOSPLIT_SELECTOR = ".pdf-quad-grid, .pdf-callout-row, .pdf-part-head, .pdf-qa, .pdf-step-callout, .pdf-tool-card";

/* Returns cumulative CSS-px y-offsets (relative to pageEl's top) marking the end of
   each printed page, nudged so a no-split block is never cut across a page break
   (unless that block alone is taller than one page, in which case it is force-split). */
function computePageBreaksCss(pageEl, maxPageHeightCss){
  var pageTop = pageEl.getBoundingClientRect().top;
  var atoms = pageEl.querySelectorAll(PDF_NOSPLIT_SELECTOR);
  var zones = [];
  for(var i=0;i<atoms.length;i++){
    var r = atoms[i].getBoundingClientRect();
    zones.push({top:r.top-pageTop, bottom:r.bottom-pageTop});
  }
  zones.sort(function(a,b){ return a.top-b.top; });
  var totalHeight = pageEl.scrollHeight;
  var breaks = [];
  var cursor = 0;
  while(cursor < totalHeight){
    var candidate = Math.min(cursor + maxPageHeightCss, totalHeight);
    if(candidate >= totalHeight){ breaks.push(totalHeight); break; }
    for(var j=0;j<zones.length;j++){
      var z = zones[j];
      if(candidate > z.top && candidate < z.bottom && z.top > cursor){
        candidate = z.top;
      }
    }
    if(candidate <= cursor) candidate = Math.min(cursor + maxPageHeightCss, totalHeight);
    breaks.push(candidate);
    cursor = candidate;
  }
  while(breaks.length>1 && (breaks[breaks.length-1]-breaks[breaks.length-2]) < 30){
    breaks.pop();
  }
  return breaks;
}

function renderCanvasToPdf(pdf, canvas, breaksCss, pageElCssHeight, isFirstOverall){
  var pdfWidthMM = 210;
  var printableWidthMM = pdfWidthMM - 2*PDF_MARGIN_MM;
  var pxPerMM = canvas.width / printableWidthMM;
  var canvasPerCss = canvas.height / pageElCssHeight;
  var prevCanvasY = 0;
  for(var i=0;i<breaksCss.length;i++){
    var breakCanvasY = (i===breaksCss.length-1) ? canvas.height : Math.round(breaksCss[i]*canvasPerCss);
    var sliceHeightPx = Math.min(breakCanvasY, canvas.height) - prevCanvasY;
    if(sliceHeightPx<=0) continue;
    var sliceCanvas = document.createElement("canvas");
    sliceCanvas.width = canvas.width;
    sliceCanvas.height = sliceHeightPx;
    var ctx = sliceCanvas.getContext("2d");
    ctx.drawImage(canvas, 0, prevCanvasY, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);
    var sliceData = sliceCanvas.toDataURL("image/png");
    var sliceHeightMM = sliceHeightPx / pxPerMM;
    if(!(isFirstOverall && i===0)) pdf.addPage();
    pdf.addImage(sliceData, "PNG", PDF_MARGIN_MM, PDF_MARGIN_MM, printableWidthMM, sliceHeightMM);
    prevCanvasY = breakCanvasY;
  }
}

function downloadPdf(){
  if(!pdfLibsReady()){ showToast("ვერ შეიქმნა — სცადეთ სქრინშოთი."); return; }
  try{
    buildPdfPages();
    var jsPDF = window.jspdf.jsPDF;
    var pdf = new jsPDF("p","mm","a4");
    var printableWidthMM = 210 - 2*PDF_MARGIN_MM;
    var printableHeightMM = 297 - 2*PDF_MARGIN_MM;
    var pages = [qs("#pdfPage1"), qs("#pdfPage2")];
    var chain = Promise.resolve();
    pages.forEach(function(pageEl, idx){
      var maxPageHeightCss = pageEl.offsetWidth * (printableHeightMM/printableWidthMM);
      var breaksCss = computePageBreaksCss(pageEl, maxPageHeightCss);
      var pageElCssHeight = pageEl.scrollHeight;
      chain = chain.then(function(){
        return window.html2canvas(pageEl, {scale:2, backgroundColor:"#ffffff"});
      }).then(function(canvas){
        renderCanvasToPdf(pdf, canvas, breaksCss, pageElCssHeight, idx===0);
      });
    });
    chain.then(function(){
      pdf.save("chemi-mogzaurobis-zhurnali.pdf");
      showToast("PDF შენახულია.");
    }).catch(function(){
      showToast("ვერ შეინახა — სცადეთ სქრინშოთი.");
    });
  }catch(e){
    showToast("ვერ შეინახა — სცადეთ სქრინშოთი.");
  }
}
